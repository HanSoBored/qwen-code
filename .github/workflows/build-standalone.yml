name: 'Build Standalone (fork)'

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref (sha/branch) to build'
        required: true
        type: 'string'
      test_files:
        description: 'Extra vitest files to run before the bundle (space-separated, e.g. "src/core/openaiContentGenerator/pipeline.test.ts")'
        required: false
        default: ''
        type: 'string'

jobs:
  build:
    name: 'Build Standalone Archives'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      actions: 'read'
    steps:
      - name: 'Checkout'
        uses: 'actions/checkout@v4'
        with:
          ref: '${{ github.event.inputs.ref }}'
          fetch-depth: 0

      - name: 'Setup Node.js'
        uses: 'actions/setup-node@v4'
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: 'Install Dependencies'
        run: 'npm ci --no-audit --progress=false'

      - name: 'Typecheck'
        run: 'npm run typecheck'

      - name: 'Targeted tests (serve fs adapter + env parse)'
        run: 'npm -w packages/cli run test -- src/serve/bridge-file-system-adapter.test.ts src/serve/run-qwen-serve.test.ts'

      - name: 'Build Bundle and Prepare Package'
        run: |-
          npm run build
          npm run bundle
          npm run prepare:package

      - name: 'Extra targeted tests (test_files input)'
        if: ${{ github.event.inputs.test_files != '' }}
        # After the bundle: package-local vitest imports workspace dist
        # output, which a fresh checkout does not have yet.
        run: 'npm -w packages/core run test -- ${{ github.event.inputs.test_files }}'

      - name: 'Build Standalone Archives'
        run: 'npm run package:standalone:release -- --version "0.21.8-fork.$(git rev-parse --short HEAD)" --out-dir dist/standalone'

      - name: 'Upload linux-arm64 archive'
        uses: 'actions/upload-artifact@v4'
        with:
          name: 'standalone-linux-arm64'
          path: |
            dist/standalone/qwen-code-linux-arm64.tar.gz
            dist/standalone/SHA256SUMS
          if-no-files-found: 'error'
